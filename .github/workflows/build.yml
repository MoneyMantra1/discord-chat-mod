name: Build NeoForge 1.21.1

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-neoforge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build NeoForge jar
        run: ./gradlew :neoforge:build --no-daemon

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: discord-chat-mod-neoforge-1.21.1
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev-shadow.jar
          if-no-files-found: error
